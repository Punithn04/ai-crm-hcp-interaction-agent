databases:
  - name: hcp-crm-db
    plan: free
    databaseName: hcp_crm
    user: hcpcrm

services:
  - type: web
    name: hcp-crm-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: DATABASE_URL
        fromDatabase:
          name: hcp-crm-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
